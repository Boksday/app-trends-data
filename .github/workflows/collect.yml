name: collect

# 매시간 수집한다(급상승 계산용). 순위 숫자만 담은 리포트는 자동으로 보내지 않는다(2026-10-15 사용자).
# 매일 아침 리포트는 Claude가 이 데이터를 읽고 '어떤 앱을 만들지' 판단해 보낸다. report.mjs는 손으로 돌릴 때만 쓴다.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "리포트도 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect.mjs
      - name: Commit data
        run: |
          git config user.name "app-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Numbers report (manual only)
        if: inputs.report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/report.mjs
